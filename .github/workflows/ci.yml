name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  create-appytron:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-appytron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # types/build only; no runtime binary needed in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run dup
      - run: npm run deadcode
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs the template's checks on a freshly scaffolded app, not on template/ in place.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: .github/scripts/scaffold-check.sh

  # E1: a plain install of a fresh scaffold must leave the Electron binary electron-vite looks for. Downloads the
  # binary (the other jobs skip it), so it is its own job; the planted break (no postinstall) must fail.
  electron-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: .github/scripts/electron-binary-check.sh
      - name: planted break must fail
        run: |
          if .github/scripts/electron-binary-check.sh "$(mktemp -d)" --break; then echo "planted break passed"; exit 1; fi

  # An app scaffolded from the PUBLISHED create-appytron@0.2.0 must lint after the upgrade from this branch.
  # Uses the npm registry; the planted-break run must fail.
  upgrade-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: .github/scripts/upgrade-proof.sh
      - name: planted break must fail
        run: |
          if .github/scripts/upgrade-proof.sh --break; then echo "planted break passed"; exit 1; fi
