name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  create-appytron:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-appytron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: template
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # types/build only; no runtime binary needed in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Runs the template's checks on a freshly scaffolded app, not on template/ in place.
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: .github/scripts/scaffold-check.sh
