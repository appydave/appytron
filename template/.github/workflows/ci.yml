name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1' # types/build only; no runtime binary needed in CI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run dup
      - run: npm run deadcode
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:gates
      - run: npm run build
